name: Official Federation conformance
on:
  pull_request:
    paths-ignore: ["**/*.md"]
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:
  workflow_call:
    inputs:
      source-ref:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: federation-${{ github.workflow }}-${{ inputs.source-ref || github.ref }}
  cancel-in-progress: true
jobs:
  official-federation:
    name: official-federation (${{ matrix.rp-signing-alg }})
    strategy:
      fail-fast: false
      matrix:
        rp-signing-alg: [RS256, PS256, ES256]
    env:
      CONFORMANCE_RP_SIGNING_ALG: ${{ matrix.rp-signing-alg }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.source-ref || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Read the pinned suite SHA
        id: upstream
        run: node -e 'const fs = require("node:fs"); const pin = JSON.parse(fs.readFileSync("scripts/conformance/upstream.json")); if (!/^[a-f0-9]{40}$/.test(pin.commit)) throw new Error("Invalid upstream SHA"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "commit=" + pin.commit + "\n");'
      - name: Check out the pinned official suite
        uses: actions/checkout@v6
        with:
          repository: openid-certification/conformance-suite
          ref: ${{ steps.upstream.outputs.commit }}
          path: .local/conformance-suite
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: .local/conformance-suite/pom.xml
      - run: npm ci
      - name: Permit the unprivileged local HTTPS listener
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=0
      - name: Run all official Federation OP modules against the local Worker
        run: npm run test:conformance
      - name: Preserve result metadata (never private suite logs or keys)
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: official-federation-results-${{ matrix.rp-signing-alg }}
          path: |
            artifacts/conformance/results.json
            artifacts/conformance/junit.xml
            artifacts/conformance/summary.md
          if-no-files-found: warn
          retention-days: 7
